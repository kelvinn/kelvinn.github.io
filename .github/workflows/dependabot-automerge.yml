name: Dependabot Auto-Merge

# Merges Dependabot PRs once every required workflow has passed on the PR's head
# commit. Runs from workflow_run so it gets a write token and can merge, which a
# pull_request run triggered by Dependabot cannot.
#
# Not auto-merged (labelled `needs-review` instead):
#   - major version bumps, and PRs with no recognisable Dependabot update metadata
#   - PRs the repair workflow pushed a fix to
on:
  workflow_run:
    workflows:
      - "CI (Non-Main Branches)"
      - "Deploy Hugo site to Pages"
    types:
      - completed
    # Only Dependabot branches, so other PRs' runs don't spawn skipped runs.
    branches:
      - "dependabot/**"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

# One evaluation per PR at a time. Each required workflow completing triggers a
# run, and whichever sees everything green does the merge.
concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge Passing Dependabot PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest

    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Inspect pull request
        id: pr
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --json author,baseRefName,headRefName,headRefOid,isDraft,state,url,commits,labels)"

          is_dependabot="$(echo "$pr_json" | jq -r '(.author.login == "dependabot[bot]") or (.author.login == "app/dependabot") or (.headRefName | startswith("dependabot/"))')"
          base="$(echo "$pr_json" | jq -r '.baseRefName')"
          draft="$(echo "$pr_json" | jq -r '.isDraft')"
          state="$(echo "$pr_json" | jq -r '.state')"
          head_sha="$(echo "$pr_json" | jq -r '.headRefOid')"

          # Dependabot records every bump in its commit message as
          #   update-type: version-update:semver-(major|minor|patch)
          # so grouped PRs are judged per dependency, not by their title. Anything
          # without that metadata is treated as major so a human looks at it.
          update_types="$(echo "$pr_json" | jq -r '[.commits[].messageBody] | join("\n")' \
            | grep -oE 'update-type: version-update:semver-[a-z]+' | sort -u || true)"
          is_major="true"
          if [ -n "$update_types" ] && ! echo "$update_types" | grep -q 'semver-major'; then
            is_major="false"
          fi

          # PRs the repair bot pushed to need a human look even if CI is green.
          has_repair_commit="$(echo "$pr_json" | jq -r '
            [.commits[]?.messageHeadline] | any(. == "fix: repair Dependabot PR checks")')"

          already_flagged="$(echo "$pr_json" | jq -r '[.labels[]?.name] | any(. == "needs-review")')"

          {
            echo "url=$(echo "$pr_json" | jq -r '.url')"
            echo "is_dependabot=$is_dependabot"
            echo "base=$base"
            echo "draft=$draft"
            echo "state=$state"
            echo "head_sha=$head_sha"
            echo "is_major=$is_major"
            echo "has_repair_commit=$has_repair_commit"
            echo "already_flagged=$already_flagged"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Dependabot auto-merge: #$PR_NUMBER"
            echo "- dependabot: $is_dependabot, base: $base, draft: $draft, state: $state"
            echo "- update types: $(echo "$update_types" | tr '\n' ' ')"
            echo "- major/unknown: $is_major, repair commit: $has_repair_commit"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check required workflows passed
        id: gate
        if: >-
          steps.pr.outputs.is_dependabot == 'true' &&
          steps.pr.outputs.base == 'main' &&
          steps.pr.outputs.draft == 'false' &&
          steps.pr.outputs.state == 'OPEN'
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # A newer push superseded the commit this run tested; its own runs will follow.
          if [ "$RUN_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "Stale run for $RUN_HEAD_SHA (PR head is $PR_HEAD_SHA); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ready="true"
          for wf in "CI (Non-Main Branches)" "Deploy Hugo site to Pages"; do
            result="$(gh run list --workflow "$wf" --commit "$PR_HEAD_SHA" --event pull_request \
              --json status,conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')"
            echo "$wf: $result"
            if [ "$result" != "success" ]; then
              ready="false"
            fi
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "Not all required workflows have passed yet; the last one to finish will re-evaluate."
          fi

      - name: Merge pull request
        id: merge
        if: >-
          steps.gate.outputs.ready == 'true' &&
          steps.pr.outputs.is_major == 'false' &&
          steps.pr.outputs.has_repair_commit == 'false'
        run: |
          for attempt in 1 2 3; do
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          exit 1

      # Merges made with GITHUB_TOKEN do not trigger the push-to-main deploy, so
      # dispatch it explicitly.
      - name: Deploy site
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run hugo.yaml --ref main

      - name: Flag for human review
        if: >-
          steps.gate.outputs.ready == 'true' &&
          steps.pr.outputs.already_flagged != 'true' &&
          (steps.pr.outputs.is_major == 'true' || steps.pr.outputs.has_repair_commit == 'true')
        env:
          IS_MAJOR: ${{ steps.pr.outputs.is_major }}
          HAS_REPAIR_COMMIT: ${{ steps.pr.outputs.has_repair_commit }}
        run: |
          reason="is a major version bump (or has no recognisable update metadata)"
          if [ "$HAS_REPAIR_COMMIT" = "true" ]; then
            reason="was modified by the automated Dependabot repair bot"
          fi

          gh label create "needs-review" --color FBCA04 \
            --description "Requires manual review before merge" >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --add-label "needs-review" || true
          gh pr comment "$PR_NUMBER" --body "CI passed, but this PR was **not** auto-merged because it $reason. Please review the diff manually before merging." || true
