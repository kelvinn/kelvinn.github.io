# Dependabot version updates.
#
# Minor and patch updates are grouped into one PR per ecosystem and are merged
# automatically once CI passes (see workflows/auto-merge.yml).
# Major updates are intentionally NOT grouped, so each arrives as its own PR
# that is labelled `needs-review` instead of being merged automatically.
# Failing PRs are handed to workflows/dependabot-pr-repair.yml.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
